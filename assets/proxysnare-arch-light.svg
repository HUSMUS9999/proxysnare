<svg xmlns="http://www.w3.org/2000/svg" width="980" height="596" viewBox="0 0 980 596" role="img" aria-label="ProxySnare Protocol-Level Anti-Repeater Architecture">
  <defs>
    <marker id="ps-acc-light" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#0284C7" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ps-ok-light" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#059669" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ps-deny-light" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#DC2626" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="ps-clip-ok-light"><rect x="180" y="388" width="288" height="34" rx="7"/></clipPath>
    <clipPath id="ps-clip-dn-light"><rect x="512" y="388" width="288" height="34" rx="7"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .hub-title { font-size: 14.5px; font-weight: 700; fill: #0F172A; letter-spacing: -0.2px; }
      .badge-txt { font-size: 9.5px; font-weight: 700; fill: #0369A1; letter-spacing: 0.55px; text-anchor: middle; }
      .step-num  { font-size: 10px; font-weight: 700; fill: #0369A1; text-anchor: middle; }
      .actor-hdr { font-size: 12.2px; font-weight: 700; fill: #0F172A; }
      .actor-dn  { font-size: 12.2px; font-weight: 700; fill: #991B1B; }
      .card-cmd  { font-size: 11.4px; font-weight: 700; fill: #0369A1; text-anchor: middle; }
      .card-ttl  { font-size: 11.4px; font-weight: 700; fill: #0F172A; }
      .body      { font-size: 10.8px; font-weight: 400; fill: #334155; }
      .muted     { font-size: 10.2px; font-weight: 400; fill: #52657D; }
      .muted-c   { font-size: 10.2px; font-weight: 400; fill: #52657D; text-anchor: middle; }
      .ok-t      { font-size: 10.8px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .dn-t      { font-size: 10.8px; font-weight: 700; fill: #991B1B; text-anchor: middle; }
      .kicker    { font-size: 10.2px; font-weight: 700; fill: #132035; letter-spacing: 0.65px; }
      .edge-acc  { fill: none; stroke: #0284C7; stroke-width: 1.5; stroke-linecap: round; }
      .edge-ok   { fill: none; stroke: #059669; stroke-width: 1.5; stroke-linecap: round; }
      .edge-deny { fill: none; stroke: #DC2626; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Self-contained rounded surface canvas -->
  <rect x="1" y="1" width="978" height="594" rx="14" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="1"/>

  <!-- TOP PROTOCOL HEADER -->
  <g id="ps-header">
    <rect x="22" y="20" width="936" height="56" rx="10" fill="#F8FBFF" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="120" y1="20.6" x2="860" y2="20.6" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

    <rect x="38" y="37.5" width="110" height="21" rx="5" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="0.9"/>
    <text class="mono badge-txt" x="93" y="51.5">PROTOCOL FLOW</text>

    <text class="sans hub-title" x="164" y="52.5">ProxySnare — Proof-of-Freshness &amp; Rotating Honey-Canary</text>

    <rect x="730" y="37.5" width="212" height="21" rx="5" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="0.9"/>
    <text class="mono badge-txt" x="836" y="51.5">ECDH P-256 + HMAC · 0 DEPS</text>
  </g>

  <!-- UNOBSTRUCTED VERTICAL LIFELINES -->
  <g id="ps-lifelines">
    <line x1="158" y1="166" x2="158" y2="426" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="490" y1="166" x2="490" y2="444" stroke="#7DD3FC" stroke-width="1.6" stroke-dasharray="4 4"/>
    <line x1="490" y1="422" x2="490" y2="444" stroke="#0284C7" stroke-width="1.5" marker-end="url(#ps-acc-light)"/>
    <line x1="822" y1="166" x2="822" y2="426" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 3 ACTOR HEADERS -->
  <g id="ps-actors">
    <rect x="22" y="94" width="272" height="72" rx="10" fill="#F8FAFC" stroke="#D5DEE9" stroke-width="1.15"/>
    <rect x="38" y="110" width="24" height="19" rx="5" fill="#E0F2FE" stroke="#93C5FD" stroke-width="0.9"/>
    <text class="mono step-num" x="50" y="123">01</text>
    <text class="sans actor-hdr" x="72" y="124">Genuine Browser</text>
    <text class="mono muted" x="38" y="148">/__proxysnare/guard.js · WebCrypto</text>

    <rect x="344" y="94" width="292" height="72" rx="10" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.25"/>
    <rect x="360" y="110" width="24" height="19" rx="5" fill="#E0F2FE" stroke="#93C5FD" stroke-width="0.9"/>
    <text class="mono step-num" x="372" y="123">02</text>
    <text class="sans actor-hdr" x="394" y="124">ProxySnare Shield</text>
    <text class="sans muted" x="360" y="148">Reverse Proxy · Node Middleware · Python</text>

    <rect x="686" y="94" width="272" height="72" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.15"/>
    <rect x="702" y="110" width="24" height="19" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.9"/>
    <text class="mono" x="714" y="123" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle">03</text>
    <text class="sans actor-dn" x="736" y="124">Repeater / MITM Proxy</text>
    <text class="sans muted" x="702" y="148">Caido · Burp Suite · mitmproxy · curl</text>
  </g>

  <!-- STEP 1: HANDSHAKE REQUEST (Browser -> Shield) -->
  <g id="ps-step1">
    <rect x="180" y="184" width="288" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="mono card-cmd" x="324" y="206">POST /handshake (P-256 + PoW)</text>

    <circle cx="158" cy="234" r="10" fill="#0284C7"/>
    <text class="mono" x="158" y="237.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <line class="edge-acc" x1="170" y1="234" x2="480" y2="234" marker-end="url(#ps-acc-light)"/>
  </g>

  <!-- STEP 2: EPHEMERAL ECDH + CANARY_0 (Shield -> Browser) -->
  <g id="ps-step2">
    <rect x="180" y="252" width="288" height="44" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="mono card-cmd" x="324" y="270">serverPub + salt + canary_0</text>
    <text class="sans muted-c" x="324" y="287">HKDF-SHA256 -&gt; WebCrypto (non-extractable)</text>

    <circle cx="490" cy="308" r="10" fill="#0284C7"/>
    <text class="mono" x="490" y="311.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <line class="edge-acc" x1="478" y1="308" x2="168" y2="308" marker-end="url(#ps-acc-light)"/>
  </g>

  <!-- SUBTLE CAPTURE CONTEXT CALLOUT ON RIGHT (y=198..294, cleanly between x=512..800, ZERO lifeline collision!) -->
  <g id="ps-capture-note">
    <rect x="512" y="198" width="288" height="94" rx="8" fill="#F8FAFC" stroke="#D5DEE9" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="sans kicker" x="656" y="220" text-anchor="middle">MITM CAPTURE SCENARIO</text>
    <text class="sans muted-c" x="656" y="241">Proxy records a legitimate signed request</text>
    <text class="sans muted-c" x="656" y="258">(exact Cookie, Origin, Sec-Fetch, X-PS-*),</text>
    <text class="sans muted-c" x="656" y="275">then pauses, edits body, or replays in Repeater</text>
  </g>

  <!-- STEP 3: GENUINE SIGNED REQUEST + CANARY ROTATION (Browser -> Shield) -->
  <g id="ps-step3">
    <rect x="180" y="324" width="288" height="44" rx="7" fill="#FFFFFF" stroke="#7FC5A8" stroke-width="1.15"/>
    <text class="mono card-cmd" x="324" y="342">POST /api/* (Signed Proof)</text>
    <text class="sans muted-c" x="324" y="359">seq=1 · nonce · canary_0 · HMAC(body)</text>

    <circle cx="158" cy="378" r="10" fill="#059669"/>
    <text class="mono" x="158" y="381.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <line class="edge-ok" x1="170" y1="378" x2="480" y2="378" marker-end="url(#ps-ok-light)"/>

    <rect x="180" y="388" width="288" height="34" rx="7" fill="#F2FBF7" stroke="#7FC5A8" stroke-width="1.15"/>
    <g clip-path="url(#ps-clip-ok-light)">
      <rect x="180" y="388" width="4" height="34" fill="#059669"/>
    </g>
    <text class="mono ok-t" x="326" y="409">200 OK · X-PS-Next-Canary: canary_1</text>
  </g>

  <!-- STEP 4: REPEATER REPLAY / TAMPER / INTERCEPT HOLD -> 403 BLOCKED (parallel right of Step 3!) -->
  <g id="ps-step4">
    <rect x="512" y="324" width="288" height="44" rx="7" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.15"/>
    <text class="sans" x="656" y="342" font-size="11.2" font-weight="700" fill="#991B1B" text-anchor="middle">Captured Request Replayed / Edited</text>
    <text class="sans muted-c" x="656" y="359">Reused nonce · stale canary_0 · &gt;8s hold</text>

    <circle cx="822" cy="378" r="10" fill="#DC2626"/>
    <text class="mono" x="822" y="381.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <line class="edge-deny" x1="810" y1="378" x2="500" y2="378" marker-end="url(#ps-deny-light)"/>

    <rect x="512" y="388" width="288" height="34" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <g clip-path="url(#ps-clip-dn-light)">
      <rect x="512" y="388" width="4" height="34" fill="#DC2626"/>
    </g>
    <text class="mono dn-t" x="658" y="409">403 REPEATER_OR_PROXY_BLOCKED</text>
  </g>

  <!-- BOTTOM BAND: 6-LAYER SERVER VERIFICATION PIPELINE (x=22..958, y=450..574) -->
  <g id="ps-server-checks">
    <rect x="22" y="450" width="936" height="124" rx="10" fill="#F8FAFC" stroke="#D5DEE9" stroke-width="1.15"/>
    <text class="sans kicker" x="38" y="472">SERVER VERIFICATION PIPELINE (STRICT &gt;= 4 · BALANCED &gt;= 6)</text>
    <rect x="850" y="458" width="92" height="18" rx="4" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="0.75"/>
    <text class="mono" x="896" y="470" font-size="8.8" font-weight="700" fill="#0369A1" text-anchor="middle">6 CHECK LAYERS</text>
    <line x1="38" y1="484" x2="942" y2="484" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Row 1 (3 equal cards: w=292, gap=14 -> x=38, 344, 650) -->
    <rect x="38" y="494" width="292" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans card-ttl" x="50" y="513">1-Use Nonce Cache</text>
    <text class="sans muted" x="318" y="513" text-anchor="end">Exact replay (+10)</text>

    <rect x="344" y="494" width="292" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans card-ttl" x="356" y="513">Body + Path HMAC</text>
    <text class="sans muted" x="624" y="513" text-anchor="end">Payload tamper (+10)</text>

    <rect x="650" y="494" width="292" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans card-ttl" x="662" y="513">Rotating Canary</text>
    <text class="sans muted" x="930" y="513" text-anchor="end">Stale token (+8)</text>

    <!-- Row 2 -->
    <rect x="38" y="532" width="292" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans card-ttl" x="50" y="551">Monotonic Seq</text>
    <text class="sans muted" x="318" y="551" text-anchor="end">seq &lt;= lastSeq (+8)</text>

    <rect x="344" y="532" width="292" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans card-ttl" x="356" y="551">Freshness Window</text>
    <text class="sans muted" x="624" y="551" text-anchor="end">8s / 15s hold (+6)</text>

    <rect x="650" y="532" width="292" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans card-ttl" x="662" y="551">Wire &amp; Fetch Meta</text>
    <text class="sans muted" x="930" y="551" text-anchor="end">CL+TE · Sec-Fetch</text>
  </g>
</svg>
